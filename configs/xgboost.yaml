data:
  x_train: data/X_train.csv
  y_train: data/y_train.csv
  x_test: data/X_test.csv
  y_test: data/y_test.csv
  label_mapping: data/label_mapping.json

model:
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1
  eval_metric: mlogloss

train:
  save_path: experiment/models/saved/xgboost.joblib

experiments:
  subpop:
    display_name: XGBoost
    hist_title: "XGBoost - Accuracy & F1 Score across 26 Populations"
    cm_title: "XGBoost - Normalized Confusion Matrix (26 Populations)"
    hist_path: experiment/results/subpop/histogram/xgboost_results.png
    cm_path: experiment/results/subpop/confusion_matrix/xgboost_confusion_matrix.png
